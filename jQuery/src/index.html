<!DOCTYPE html>
<html>
  <head>
    <title>Getting Started with DevExtreme jQuery TextBox</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="../node_modules/devextreme-dist/css/dx.material.blue.light.compact.css" />
    <link rel="stylesheet" type="text/css" href="index.css" />
    <script type="text/javascript" src="../node_modules/jquery/dist/jquery.js"></script>
    <script type="text/javascript" src="../node_modules/devextreme-dist/js/dx.all.js"></script>
    <script type="text/javascript" src="./devextreme-license.js"></script>
    <script type="text/javascript" src="index.js"></script>
  </head>

  <body class="dx-viewport">
    <div id="app-container">
      <div id="textbox-container">
        <div id="text-box"></div>
        <div id="text-box-masked"></div>
        <div id="text-box-password"></div>
        <div id="text-box-with-placeholder"></div>
        <div id="text-box-disabled"></div>
      </div>
      <div id="value-container"> The TextBox value is: <span id="textbox-value"></span> </div>
    </div>
  </body>
</html>
